[project]
name = "clear-zone-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Олійник Віталій Миронович", email = "vitaliyoliynykk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[project.scripts]
clear-zone-forecasting = "clear_zone_forecasting:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
